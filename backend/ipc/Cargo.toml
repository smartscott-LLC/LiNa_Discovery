[package]
name = "ipc_bridge"
version = "0.1.0"
edition = "2021"
description = "LINA/Triton dual-chamber zero-copy IPC bridge (PyO3 + memmap3)"
license = "MIT"

[lib]
name = "ipc_bridge"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.26", features = ["extension-module"] }
ipc_core = { path = "../ipc-core" }

[profile.release]
lto = true
opt-level = 3
