<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- LINA's mark: a 14-point constellation — the polytope she lives inside -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <circle cx="64" cy="64" r="34" fill="none" stroke="#7c3aed" stroke-width="2" opacity="0.6"/>
  <circle cx="64" cy="64" r="5" fill="#06b6d4"/>
  <g stroke="#8b5cf6" stroke-width="2" fill="#06b6d4">
    <circle cx="64" cy="28" r="3"/>
    <circle cx="89" cy="38" r="3"/>
    <circle cx="99" cy="64" r="3"/>
    <circle cx="89" cy="90" r="3"/>
    <circle cx="64" cy="100" r="3"/>
    <circle cx="39" cy="90" r="3"/>
    <circle cx="29" cy="64" r="3"/>
    <circle cx="39" cy="38" r="3"/>
  </g>
  <g stroke="#7c3aed" stroke-width="1.2" opacity="0.7">
    <line x1="64" y1="28" x2="89" y2="38"/><line x1="89" y1="38" x2="99" y2="64"/>
    <line x1="99" y1="64" x2="89" y2="90"/><line x1="89" y1="90" x2="64" y2="100"/>
    <line x1="64" y1="100" x2="39" y2="90"/><line x1="39" y1="90" x2="29" y2="64"/>
    <line x1="29" y1="64" x2="39" y2="38"/><line x1="39" y1="38" x2="64" y2="28"/>
  </g>
</svg>
