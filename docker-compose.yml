# LINA's databases — the only containers she keeps, because they are
# infrastructure, not her. LINA herself is native on this machine: she runs
# as `lina.service` (systemd) straight from the repo, on the same hardware
# as her voice engine, her cortex, and the DragonCache carve. Her state
# lives in <repo>/runtime, her logs at <repo>/runtime/logs, her desk at
# <repo>/runtime/workspace — all on the host, all hers.
#
#   docker compose up -d          # brings up postgres + dragonfly only
#   sudo systemctl start lina    # brings up LINA herself
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: collabsmart-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-collabsmart}
      - POSTGRES_USER=${POSTGRES_USER:-collabsmart}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-collabsmart}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - ./backend/db/lina_schema.sql:/docker-entrypoint-initdb.d/01-lina-schema.sql:ro
    ports:
      - "5432:5432"
    networks:
      - collabsmart
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          PGPASSWORD=${POSTGRES_PASSWORD:-collabsmart}
          psql -U ${POSTGRES_USER:-collabsmart} -d ${POSTGRES_DB:-collabsmart}
          -c 'SELECT 1' -q --no-psqlrc > /dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 5

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: collabsmart-dragonfly
    command: dragonfly --logtostderr --requirepass ${DRAGONFLY_PASSWORD:-collabsmart} --maxmemory ${DRAGONFLY_MAX_MEMORY:-2gb} --proactor_threads=4
    environment:
      - DRAGONFLY_PASSWORD=${DRAGONFLY_PASSWORD:-collabsmart}
    ulimits:
      memlock: -1
    volumes:
      - dragonfly_data:/data
    ports:
      - "6379:6379"
    networks:
      - collabsmart
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          redis-cli --no-auth-warning -a "$DRAGONFLY_PASSWORD" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  dragonfly_data:
    driver: local

networks:
  collabsmart:
    driver: bridge
