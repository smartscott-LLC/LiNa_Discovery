services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: collabsmart-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-collabsmart}
      - POSTGRES_USER=${POSTGRES_USER:-collabsmart}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-collabsmart}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - ./backend/db/lina_schema.sql:/docker-entrypoint-initdb.d/01-lina-schema.sql:ro
    ports:
      - "5432:5432"
    networks:
      - collabsmart
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          PGPASSWORD=${POSTGRES_PASSWORD:-collabsmart}
          psql -U ${POSTGRES_USER:-collabsmart} -d ${POSTGRES_DB:-collabsmart}
          -c 'SELECT 1' -q --no-psqlrc > /dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 5

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: collabsmart-dragonfly
    command: dragonfly --logtostderr --requirepass ${DRAGONFLY_PASSWORD:-collabsmart} --maxmemory ${DRAGONFLY_MAX_MEMORY:-2gb} --proactor_threads=4
    environment:
      - DRAGONFLY_PASSWORD=${DRAGONFLY_PASSWORD:-collabsmart}
    ulimits:
      memlock: -1
    volumes:
      - dragonfly_data:/data
    ports:
      - "6379:6379"
    networks:
      - collabsmart
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          redis-cli --no-auth-warning -a "$DRAGONFLY_PASSWORD" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5

  lina:
    build:
      context: .
      dockerfile: backend/lina/Dockerfile
    container_name: collabsmart-lina
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-collabsmart}:${POSTGRES_PASSWORD:-collabsmart}@postgres:5432/${POSTGRES_DB:-collabsmart}
      - REDIS_URL=redis://:${DRAGONFLY_PASSWORD:-collabsmart}@dragonfly:6379
      # LINA's voice — provider-agnostic, defaulting to DeepSeek.
      - AI_PROVIDER=${AI_PROVIDER:-deepseek}
      - AI_PROVIDERS=${AI_PROVIDERS:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # The likeness half of recall (Phase F) — embeddings via an
      # OpenAI-compatible endpoint; falls back to OPENROUTER_API_KEY.
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-}
      - EMBEDDING_BASE_MODEL=${EMBEDDING_BASE_MODEL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_REFERER=${EMBEDDING_REFERER:-}
      - EMBEDDING_TITLE=${EMBEDDING_TITLE:-}
      # Service configuration.
      - HOST=0.0.0.0
      - PORT=8001
      - IPC_FORESIGHT_TIMEOUT=${IPC_FORESIGHT_TIMEOUT:-2.5}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LINA_MAX_TOKENS=${LINA_MAX_TOKENS:-4096}
      - LINA_VOICE_MAX_CONCURRENT=${LINA_VOICE_MAX_CONCURRENT:-4}
      # Her desk inside the container (state + PWA shell + theme).
      - LINA_STATE_DIR=/app/runtime
      - PWA_DIR=/app/pwa
      - ASSETS_DIR=/app/assets
      - WORKSPACE_PATH=/workspace
      # Her reach — the rooms inside her body. The container is her home;
      # these are the places she may touch, always behind the counsel ledger
      # (and on her own in Winter). /app is her home and its logs; /app/runtime
      # is her state; /workspace is her desk.
      - LINA_ACCESS_ROOTS=/workspace:/app/runtime:/app
      - BROWSER_TIMEOUT=${BROWSER_TIMEOUT:-15}
      # Optional services (opt-in).
      - METRICS_ENABLED=${METRICS_ENABLED:-0}
      - HEARTBEAT_ENABLED=${HEARTBEAT_ENABLED:-0}
    ports:
      - "8001:8001"
    networks:
      - collabsmart
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      # Actions approved through the HITL ledger execute here — her shared
      # workspace, where her files live.
      - workspace:/workspace
      # Live design surface: your theme and the shell mount read-only from
      # the host, so color and UI edits appear without a rebuild (the image
      # still bakes defaults for deployment).
      - ./assets:/app/assets:ro
      - ./backend/pwa:/app/pwa:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/lina/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  workspace:
    driver: local
  postgres_data:
    driver: local
  dragonfly_data:
    driver: local

networks:
  collabsmart:
    driver: bridge
